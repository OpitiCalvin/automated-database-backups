---
# --- Connection settings ---
pg_backup_host: "localhost"
pg_backup_port: 5432
# OS user that owns/runs the backup (should match a role that can authenticate,
# e.g. via peer auth when this equals the postgres OS user, or via .pgpass)
pg_backup_os_user: "calvin"
pg_backup_os_group: "calvin"
# DB role used for pg_dump/pg_dumpall/psql
pg_backup_db_user: "backup_user"

# Set to true if the DB user needs password auth (via .pgpass) instead of
# peer/trust auth for localhost connections.
pg_backup_use_pgpass: true

# Controls how the .pgpass file's contents are sourced:
#   "auto" (default) - prefer a .pgpass already present on the VM at
#            pg_backup_pgpass_path (0600 perms, e.g. placed manually or by
#            a secrets agent/Vault/SOPS). If it's missing or unsafe, fall
#            back to rendering it from pg_backup_password instead (e.g. a
#            Semaphore secret Environment variable).
#   true   - always render/own the file from pg_backup_password.
#   false  - always require an externally-provisioned file; fail if it's
#            missing or unsafe rather than falling back to a password.
pg_backup_manage_pgpass: "auto"

# Only read when the file ends up being rendered (see pg_backup_manage_pgpass
# above). Provide this via a Semaphore secret Environment variable or an
# Ansible Vault file (e.g. group_vars/*/vault.yml) - never commit it in
# plaintext.
pg_backup_password: ""
pg_backup_pgpass_path: "/home/{{ pg_backup_os_user }}/.pgpass"

# --- Backup/log locations ---
# If pg_backup_dir/pg_backup_log_dir live on a separately-mounted filesystem
# (NAS, external disk, etc.), set pg_backup_require_mount: true and point
# pg_backup_mount_path at that mount. The role then refuses to create either
# directory unless the mount is actually attached - otherwise `file:
# state=directory` would silently create them on the root filesystem if the
# mount is missing (e.g. not yet attached after a reboot), and backups would
# "succeed" while quietly landing on the wrong disk.
pg_backup_require_mount: false
pg_backup_mount_path: ""

# pg_backup_dir: "/var/backups/postgresql"
# pg_backup_log_dir: "/var/log/postgresql_backups"
pg_backup_dir: "/mnt/homelab_backups/db_backups/postgresql"
pg_backup_log_dir: "/mnt/homelab_backups/db_backups/logs"
pg_backup_days_to_keep: 120

# --- Script deployment ---
pg_backup_script_path: "/usr/local/bin/pg_backup.sh"

# --- Package installation ---
# Default false: pg_backup_host is "localhost", so this role runs directly on
# the DB server, which already has client tools matching the server's exact
# version. Installing a second, generic/unversioned client package here can
# put a DIFFERENT major version's pg_restore on PATH than the pg_dump that
# wrote the archive, causing "unsupported version (x.x) in file header" and
# every backup to fail validation. Only set this true (and pin an exact
# version in pg_backup_packages) if this host genuinely has no client tools
# yet.
pg_backup_install_packages: false
pg_backup_packages:
  Debian:
    - postgresql-client
  RedHat:
    - postgresql

# --- Scheduling ---
# Leave pg_backup_cron_enabled false (default) when a Semaphore Schedule on
# this playbook's Task Template is what triggers backups - the OS cron job
# would otherwise run backups independently and double them up. Set it true
# only if the target host should also (or instead) schedule backups itself
# via its own crontab, independent of Semaphore.
pg_backup_cron_enabled: false
pg_backup_cron_name: "PostgreSQL automated backup"
pg_backup_cron_minute: "0"
pg_backup_cron_hour: "2"
pg_backup_cron_day: "*"
pg_backup_cron_month: "*"
pg_backup_cron_weekday: "*"

# Execute pg_backup.sh during this playbook run. Defaults to true so that a
# Semaphore Schedule simply running this playbook on a cron expression
# performs an actual backup each time. Set to false for a deploy-only run
# (e.g. to update the script/config without taking a backup).
pg_backup_run_now: true
