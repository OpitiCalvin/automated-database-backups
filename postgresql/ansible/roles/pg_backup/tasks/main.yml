---
- name: Install PostgreSQL client packages
  ansible.builtin.package:
    name: "{{ pg_backup_packages[ansible_facts['os_family']] }}"
    state: present
  when: pg_backup_install_packages | bool
  tags: [deploy]

- name: Verify the backup mount is actually mounted
  ansible.builtin.command: "mountpoint -q {{ pg_backup_mount_path }}"
  register: pg_backup_mount_check
  changed_when: false
  failed_when: false
  when: pg_backup_require_mount | bool
  tags: [deploy]

- name: Fail if the backup mount point is not mounted
  ansible.builtin.assert:
    that:
      - pg_backup_mount_check.rc == 0
    fail_msg: >-
      {{ pg_backup_mount_path }} is not currently a mounted filesystem.
      Refusing to create pg_backup_dir/pg_backup_log_dir under it - doing
      so would silently create them on the root filesystem instead of the
      intended mounted storage. Mount it first, then re-run.
    success_msg: "{{ pg_backup_mount_path }} is mounted."
  when: pg_backup_require_mount | bool
  tags: [deploy]

- name: Ensure backup directory exists
  ansible.builtin.file:
    path: "{{ pg_backup_dir }}"
    state: directory
    owner: "{{ pg_backup_os_user }}"
    group: "{{ pg_backup_os_group }}"
    mode: "0750"
  tags: [deploy]

- name: Verify backup directory exists
  ansible.builtin.stat:
    path: "{{ pg_backup_dir }}"
  register: pg_backup_dir_stat
  tags: [deploy]

- name: Fail if the backup directory could not be created
  ansible.builtin.assert:
    that:
      - pg_backup_dir_stat.stat.exists
      - pg_backup_dir_stat.stat.isdir
    fail_msg: "{{ pg_backup_dir }} does not exist after attempting to create it - aborting."
  tags: [deploy]

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ pg_backup_log_dir }}"
    state: directory
    owner: "{{ pg_backup_os_user }}"
    group: "{{ pg_backup_os_group }}"
    mode: "0750"
  tags: [deploy]

- name: Verify log directory exists
  ansible.builtin.stat:
    path: "{{ pg_backup_log_dir }}"
  register: pg_backup_log_dir_stat
  tags: [deploy]

- name: Fail if the log directory could not be created
  ansible.builtin.assert:
    that:
      - pg_backup_log_dir_stat.stat.exists
      - pg_backup_log_dir_stat.stat.isdir
    fail_msg: "{{ pg_backup_log_dir }} does not exist after attempting to create it - aborting."
  tags: [deploy]

- name: Check for an existing .pgpass on the target host
  ansible.builtin.stat:
    path: "{{ pg_backup_pgpass_path }}"
  register: pg_backup_pgpass_stat
  when: pg_backup_use_pgpass | bool
  tags: [deploy]

- name: Determine whether the existing .pgpass is present and safe
  ansible.builtin.set_fact:
    pg_backup_pgpass_external_ok: "{{ pg_backup_pgpass_stat.stat.exists and pg_backup_pgpass_stat.stat.mode == '0600' }}"
  when: pg_backup_use_pgpass | bool
  tags: [deploy]

- name: Decide whether this role should render .pgpass itself
  ansible.builtin.set_fact:
    pg_backup_should_manage_pgpass: >-
      {{ (pg_backup_manage_pgpass | string | lower == 'true')
         or (pg_backup_manage_pgpass | string | lower == 'auto'
             and not (pg_backup_pgpass_external_ok | default(false) | bool)) }}
  when: pg_backup_use_pgpass | bool
  tags: [deploy]

- name: Fail if no existing .pgpass was found/safe and no password is available to render one
  ansible.builtin.assert:
    that:
      - pg_backup_password | length > 0
    fail_msg: >-
      No usable .pgpass was found at {{ pg_backup_pgpass_path }} (missing or
      not mode 0600), and pg_backup_password is empty. Either place a valid
      .pgpass there yourself, or set pg_backup_password (e.g. via a
      Semaphore secret Environment variable) so this role can create it.
  when: pg_backup_use_pgpass | bool and pg_backup_should_manage_pgpass | bool
  tags: [deploy]

- name: Render .pgpass from pg_backup_password
  ansible.builtin.template:
    src: pgpass.j2
    dest: "{{ pg_backup_pgpass_path }}"
    owner: "{{ pg_backup_os_user }}"
    group: "{{ pg_backup_os_group }}"
    mode: "0600"
  when: pg_backup_use_pgpass | bool and pg_backup_should_manage_pgpass | bool
  no_log: true
  tags: [deploy]

- name: Fail if pg_backup_manage_pgpass is false but no safe externally-managed .pgpass exists
  ansible.builtin.assert:
    that:
      - pg_backup_pgpass_external_ok | bool
    fail_msg: >-
      pg_backup_manage_pgpass is false, so this role expects
      {{ pg_backup_pgpass_path }} to already exist (mode 0600, owned by
      {{ pg_backup_os_user }}) on the target host. Provision it out of
      band, or set pg_backup_manage_pgpass to "auto" or true and provide
      pg_backup_password.
  when: >-
    pg_backup_use_pgpass | bool
    and pg_backup_manage_pgpass | string | lower == 'false'
    and not (pg_backup_pgpass_external_ok | bool)
  tags: [deploy]

- name: Determine the target PostgreSQL server's major version
  ansible.builtin.command: >-
    psql -h {{ pg_backup_host }} -p {{ pg_backup_port }} -U {{ pg_backup_db_user }}
    -d postgres -tAc "SHOW server_version_num;"
  become: true
  become_user: "{{ pg_backup_os_user }}"
  register: pg_backup_server_version_num
  changed_when: false
  tags: [deploy]

- name: Compute PostgreSQL server major version
  ansible.builtin.set_fact:
    pg_backup_server_major: "{{ (pg_backup_server_version_num.stdout | trim | int) // 10000 }}"
  tags: [deploy]

- name: Check for versioned client binaries matching the server (Debian layout)
  ansible.builtin.stat:
    path: "/usr/lib/postgresql/{{ pg_backup_server_major }}/bin/pg_dump"
  register: pg_backup_debian_bin_stat
  tags: [deploy]

- name: Check for versioned client binaries matching the server (RHEL/PGDG layout)
  ansible.builtin.stat:
    path: "/usr/pgsql-{{ pg_backup_server_major }}/bin/pg_dump"
  register: pg_backup_rhel_bin_stat
  tags: [deploy]

- name: Determine the matching PostgreSQL client bin directory
  ansible.builtin.set_fact:
    pg_backup_pg_bin_dir: >-
      {{ '/usr/lib/postgresql/' ~ pg_backup_server_major ~ '/bin' if pg_backup_debian_bin_stat.stat.exists
         else ('/usr/pgsql-' ~ pg_backup_server_major ~ '/bin' if pg_backup_rhel_bin_stat.stat.exists else '') }}
  tags: [deploy]

- name: Fail if no client binaries match the server's major version
  ansible.builtin.assert:
    that:
      - pg_backup_pg_bin_dir | length > 0
    fail_msg: >-
      The server reports major version {{ pg_backup_server_major }}, but no
      matching pg_dump was found at
      /usr/lib/postgresql/{{ pg_backup_server_major }}/bin or
      /usr/pgsql-{{ pg_backup_server_major }}/bin. Install the client
      package matching the running server (e.g.
      postgresql-client-{{ pg_backup_server_major }} on Debian/Ubuntu, or
      postgresql{{ pg_backup_server_major }} on RHEL/PGDG).
    success_msg: >-
      Using PostgreSQL {{ pg_backup_server_major }} client binaries from
      {{ pg_backup_pg_bin_dir }}.
  tags: [deploy]

- name: Deploy pg_backup.sh script
  ansible.builtin.template:
    src: pg_backup.sh.j2
    dest: "{{ pg_backup_script_path }}"
    owner: root
    group: "{{ pg_backup_os_group }}"
    mode: "0750"
  tags: [deploy]

- name: Schedule pg_backup.sh via cron
  ansible.builtin.cron:
    name: "{{ pg_backup_cron_name }}"
    user: "{{ pg_backup_os_user }}"
    job: "{{ pg_backup_script_path }}"
    minute: "{{ pg_backup_cron_minute }}"
    hour: "{{ pg_backup_cron_hour }}"
    day: "{{ pg_backup_cron_day }}"
    month: "{{ pg_backup_cron_month }}"
    weekday: "{{ pg_backup_cron_weekday }}"
    state: present
  when: pg_backup_cron_enabled | bool
  tags: [deploy]

- name: Remove cron schedule
  ansible.builtin.cron:
    name: "{{ pg_backup_cron_name }}"
    user: "{{ pg_backup_os_user }}"
    state: absent
  when: not (pg_backup_cron_enabled | bool)
  tags: [deploy]

- name: Run pg_backup.sh
  ansible.builtin.command: "{{ pg_backup_script_path }}"
  become: true
  become_user: "{{ pg_backup_os_user }}"
  register: pg_backup_run_now_result
  changed_when: true
  when: pg_backup_run_now | bool
  tags: [run]

- name: Show backup run output
  ansible.builtin.debug:
    var: pg_backup_run_now_result.stdout_lines
  when: pg_backup_run_now | bool
  tags: [run]
