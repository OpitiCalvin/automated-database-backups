---
# Overrides for role defaults (see roles/pg_backup/defaults/main.yml).
# pg_backup_dir: "/var/backups/postgresql"
pg_backup_dir: "/mnt/homelab_backups/db_backups/postgresql"
# pg_backup_log_dir: "/var/log/postgresql_backups"
pg_backup_log_dir: "/mnt/homelab_backups/db_backups/logs"
pg_backup_days_to_keep: 120

# /mnt/homelab_backups is a separate mount (NAS/external disk) - refuse to
# create the backup/log directories unless it's actually mounted, so a
# missing mount fails loudly instead of silently writing to the root disk.
pg_backup_require_mount: true
pg_backup_mount_path: "/mnt/homelab_backups"
pg_backup_db_user: "backup_user"
pg_backup_os_user: "calvin"

pg_backup_cron_hour: "2"
pg_backup_cron_minute: "0"

# backup_user needs password auth (not peer/trust) for localhost connections.
# pg_backup_manage_pgpass defaults to "auto": if a .pgpass already exists on
# the VM at /home/calvin/.pgpass (0600 perms) it's left alone; otherwise the
# role renders it from pg_backup_password, e.g. a Semaphore secret
# Environment variable, or a vaulted var: pg_backup_password: "{{ vault_pg_backup_password }}"
pg_backup_use_pgpass: true
